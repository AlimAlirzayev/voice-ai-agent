name: Deploy to Hetzner

on:
  push:
    branches: [main]
    paths:
      - "apps/voice-ai-agent/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            APP_DIR="/opt/voice-ai-agent"
            REPO_URL="https://github.com/AlimAlirzayev/voice-ai-agent.git"

            if [ ! -d "$APP_DIR/.git" ]; then
              git clone "$REPO_URL" "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            if [ ! -f .env ]; then
              echo "ERROR: $APP_DIR/.env tapılmadı. .env.example faylından yaradıb secret-ləri doldur." >&2
              exit 1
            fi

            docker compose up -d --build --remove-orphans
            docker image prune -f
