[project]
name = "voice-ai-agent"
version = "0.1.0"
description = "Voice AI Agent - FastAPI + LangGraph + Whisper + ElevenLabs"
requires-python = ">=3.12,<3.13"

dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.20",
    "langgraph>=1.2.10",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langsmith>=0.10.16",
    "langgraph-checkpoint>=4.1.1",
    "langgraph-checkpoint-sqlite>=3.0.0",
    "aiosqlite>=0.22.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "openai>=2.53.0",
    "elevenlabs>=2.0.0",
    "python-telegram-bot>=22.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
