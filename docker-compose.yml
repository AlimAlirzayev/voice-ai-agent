name: voice-ai-agent

services:
  api:
    image: voice-ai-agent:local
    build:
      context: ./apps/voice-ai-agent
    restart: unless-stopped
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://api:8000
      SQLITE_PATH: /data/checkpoints.sqlite
      FEEDBACK_PATH: /data/feedback.sqlite
    volumes:
      - voice_memory:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/').read()"
      interval: 10s
      timeout: 5s
      retries: 5

  telegram-bot:
    image: voice-ai-agent:local
    build:
      context: ./apps/voice-ai-agent
    command: ["python", "bot.py"]
    profiles: ["telegram"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_URL: http://api:8000
      SQLITE_PATH: /data/checkpoints.sqlite
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - voice_memory:/data

  n8n-import:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    entrypoint: /bin/sh
    command:
      - -c
      - |
        if [ -z "$(n8n list:workflow --onlyId)" ]; then
          n8n import:workflow --separate --input=/workflows
        else
          echo "n8n workflows already exist, skipping import"
        fi
    environment: &n8n-env
      BACKEND_URL: http://api:8000
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-Asia/Baku}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-voice-ai-agent-dev-key-change-me}
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_USER_MANAGEMENT_JWT_SECRET: ${N8N_USER_MANAGEMENT_JWT_SECRET:-voice-ai-agent-dev-jwt-change-me}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://127.0.0.1:5678/}
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      api:
        condition: service_healthy

  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${N8N_HOST_PORT:-5678}:5678"
    environment:
      <<: *n8n-env
      N8N_HOST: 0.0.0.0
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://127.0.0.1:5678/}
    volumes:
      - n8n_storage:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    depends_on:
      n8n-import:
        condition: service_completed_successfully

volumes:
  voice_memory:
  n8n_storage:
